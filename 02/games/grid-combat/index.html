<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Isometric Grid Combat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      html {
        font-size: 14px;
      }
      @media (min-width: 768px) {
        html {
          font-size: 16px;
        }
      }
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      .iso-grid {
        transform: rotateX(55deg) rotateZ(-45deg);
        transform-style: preserve-3d;
      }
      .grid-cell {
        transition: background-color 0.2s ease-in-out, transform 0.2s ease-in-out;
      }
       .grid-cell:hover {
        transform: translateZ(10px);
      }
      .player-token {
        transition: all 0.5s ease-in-out;
        transform-style: preserve-3d;
      }
       .player-token-inner {
        transform: rotateZ(45deg) rotateX(-55deg);
      }
      
      .floating-text {
        animation: floatUp 1.5s ease-out forwards;
        text-shadow: 0px 0px 5px rgba(0,0,0,0.7);
      }

      @keyframes floatUp {
        0% {
          opacity: 1;
          transform: translateY(0);
        }
        100% {
          opacity: 0;
          transform: translateY(-50px);
        }
      }

      @keyframes countdown {
        0% {
          opacity: 0;
          transform: scale(2);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: scale(0.5);
        }
      }

      .countdown-animation {
        animation: countdown 1s ease-in-out forwards;
      }

      .modal-enter {
        opacity: 0;
        transform: scale(0.9);
      }
      .modal-enter-active {
        opacity: 1;
        transform: translateX(0);
        transition: opacity 300ms, transform 300ms;
      }
      .modal-exit {
        opacity: 1;
      }
      .modal-exit-active {
        opacity: 0;
        transform: scale(0.9);
        transition: opacity 300ms, transform 300ms;
      }
      
      @keyframes tile-flash-source {
        50% { background-color: rgba(200, 200, 200, 0.4); }
      }
      @keyframes tile-flash-attack-target {
        50% { background-color: rgba(239, 68, 68, 0.6); }
      }
      @keyframes tile-flash-move {
        50% { background-color: rgba(34, 197, 94, 0.6); }
      }
      @keyframes tile-flash-buff {
        50% { background-color: rgba(59, 130, 246, 0.7); }
      }
      @keyframes tile-flash-special {
        50% { background-color: rgba(168, 85, 247, 0.7); }
      }

      .animation-tile {
        animation-duration: 0.6s;
        animation-timing-function: ease-in-out;
        animation-fill-mode: forwards;
        pointer-events: none;
        transform: translateZ(1px); /* Ensure it's above the grid */
      }
      .animation-source { animation-name: tile-flash-source; }
      .animation-target-attack { animation-name: tile-flash-attack-target; }
      .animation-target-move { animation-name: tile-flash-move; }
      .animation-target-buff { animation-name: tile-flash-buff; }
      .animation-target-special { animation-name: tile-flash-special; }

      @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .animate-spin-slow {
        animation: spin-slow 2s linear infinite;
      }

    </style>
  <script type="importmap">
{

</script>

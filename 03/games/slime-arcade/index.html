<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slime Arcade Battles</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'VT323', monospace;
      background-color: #000;
    }

    .flicker {
      animation: flicker 1.5s infinite alternate;
    }
    @keyframes flicker {
      0%, 18%, 22%, 25%, 53%, 57%, 100% {
        text-shadow:
          0 0 4px #0f0,
          0 0 11px #0f0,
          0 0 19px #0f0,
          0 0 40px #0f0;
      }
      20%, 24%, 55% { text-shadow: none; }
    }

    .pixel-border {
        border: 4px solid;
        border-image-slice: 2;
        border-image-width: 2;
        border-image-repeat: stretch;
        border-image-source: url('data:image/svg+xml;utf8,<svg width="6" height="6" viewBox="0 0 6 6" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 0H4V2H6V4H4V6H2V4H0V2H2V0Z" fill="%2300ff00"/></svg>');
        border-image-outset: 2;
        position: relative;
        background: #000;
    }

    /* Battle Animations */
    @keyframes shake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
      40%, 60% { transform: translate3d(4px, 0, 0); }
    }
    .shake {
      animation: shake 0.82s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes feedback-popup {
      0% {
        opacity: 1;
        transform: translateY(0);
      }
      100% {
        opacity: 0;
        transform: translateY(-50px);
      }
    }
    .feedback-popup {
      animation: feedback-popup 1s ease-out forwards;
    }

    @keyframes ability-glow {
      0% { box-shadow: 0 0 0px 0px rgba(255, 255, 102, 0); }
      50% { box-shadow: 0 0 15px 5px rgba(255, 255, 102, 0.7); }
      100% { box-shadow: 0 0 0px 0px rgba(255, 255, 102, 0); }
    }
    .ability-glow {
      animation: ability-glow 1s ease-out;
    }

    /* Memory Game Animations */
    .card-container {
      perspective: 1000px;
    }
    .card-flipper {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s;
      transform-style: preserve-3d;
    }
    .card-container.flipped .card-flipper {
      transform: rotateY(180deg);
    }
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-back {
      transform: rotateY(180deg);
    }
    @keyframes glow-success {
        0%, 100% { box-shadow: 0 0 0px #fff; }
        50% { box-shadow: 0 0 15px 5px #0f0; }
    }
    .matched-glow {
        animation: glow-success 0.8s ease-out;
    }

    /* Connect the Dots Animation */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .box-capture-animation {
      opacity: 0; /* Start invisible */
      animation: fadeIn 0.5s ease-out forwards;
    }

    /* Jump Frog Animations */
    @keyframes hop {
        0%, 100% { transform: scale(1) translateY(0); }
        50% { transform: scale(1.2) translateY(-5px); }
    }
    .frog-hop {
        animation: hop 0.2s ease-out;
    }
    @keyframes splash {
        0% { transform: scale(0); opacity: 1; }
        100% { transform: scale(2); opacity: 0; }
    }
    .splash-animation {
        border-radius: 50%;
        border: 2px solid cyan;
        animation: splash 0.5s ease-out forwards;
    }
    @keyframes squash {
        0% { transform: scale(1, 1); }
        50% { transform: scale(1.5, 0.2); }
        100% { transform: scale(1, 1); opacity: 0; }
    }
    .squash-animation {
        background-color: #90EE90; /* lightgreen */
        animation: squash 0.3s ease-out forwards;
    }
    @keyframes blink {
        50% { opacity: 0.5; }
    }
    .blinking-turtle {
        animation: blink 0.5s infinite;
    }
    @keyframes pulse-home {
        0%, 100% { background-color: rgba(107, 114, 128, 0.3); }
        50% { background-color: rgba(107, 114, 128, 0.6); }
    }
    .home-pulse {
        animation: pulse-home 2s infinite;
    }
    @keyframes level-up-fade {
        0% { opacity: 1; transform: scale(1); }
        100% { opacity: 0; transform: scale(1.5); }
    }
    .level-up-animation {
        animation: level-up-fade 1.5s ease-out forwards;
    }

    /* Slime Bomber Animations */
    @keyframes screen-flash {
      from { background-color: rgba(255, 0, 0, 0.5); }
      to { background-color: transparent; }
    }
    .screen-flash {
      animation: screen-flash 0.3s ease-out;
    }

    @keyframes float-up {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-30px); }
    }
    .floating-text {
      animation: float-up 1s ease-out forwards;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
    .pulsing-bomb {
      animation: pulse 1s infinite;
    }

    @keyframes explode {
      0% { transform: scale(0.5); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); opacity: 0; }
    }
    .explosion-animation {
      animation: explode 0.4s ease-out forwards;
    }

    @keyframes score-popup {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-40px); }
    }
    .score-popup {
      animation: score-popup 1.2s ease-out forwards;
    }

    /* Slime Impact Animations */
    @keyframes swirl {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }
    .gravity-bullet {
        background: radial-gradient(circle, #4a00e0 0%, #8e2de2 50%, transparent 70%);
        animation: swirl 1s linear infinite;
        border-radius: 50%;
    }
    
    /* Whack-a-Slime Animations */
    @keyframes slime-pop-up {
        from { transform: translateY(100%); }
        to { transform: translateY(0); }
    }
    .slime-up { animation: slime-pop-up 0.2s ease-out; }
    
    @keyframes slime-hide {
        from { transform: translateY(0); }
        to { transform: translateY(100%); }
    }
    .slime-hiding { animation: slime-hide 0.2s ease-out forwards; }
    
    @keyframes slime-hit {
        0% { transform: scale(1); }
        50% { transform: scale(1.2, 0.5); }
        100% { transform: scale(0.1); opacity: 0; }
    }
    .slime-hit { animation: slime-hit 0.3s ease-out forwards; }
    
    @keyframes whack-score-float {
        from { opacity: 1; transform: translateY(0); }
        to { opacity: 0; transform: translateY(-40px); }
    }
    .whack-score { animation: whack-score-float 1s ease-out forwards; }
    
    @keyframes timer-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
    }
    .timer-pulse { animation: timer-pulse 1s infinite; }

  </style>
  <script type="importmap">
  {
    "imports": {
      "react": "https://aistudiocdn.com/react@^19.1.1",
      "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",
      "react/": "https://aistudiocdn.com/react@^19.1.1/",
      "@google/genai": "https://aistudiocdn.com/@google/genai@^1.20.0"
    }
  }
  </script>
  <style>
    #arcade-ribbon { position: fixed; z-index: 10000; top: 10px; right: 12px; padding: 6px 9px; border: 1px solid #82f16b; color: #e3ffdc; background: rgba(0,15,8,.88); box-shadow: 0 0 18px rgba(130,241,107,.22); font: 700 10px/1 system-ui, sans-serif; letter-spacing: .12em; pointer-events: none; }
  </style>
</head>
<body>
  <div id="arcade-ribbon">BATTLE ARCADE · SLIME ARCADE</div>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
